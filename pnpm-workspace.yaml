packages:
  - packages/core
  - packages/meta
  - packages/node

allowBuilds:
  electron: true
  esbuild: true
  node-addon-slsa: true

blockExoticSubdeps: true

# required for `bump-version` script to not trigger packages reinstall
verifyDepsBeforeRun: false

catalog:
  "@codecov/vite-plugin": 2.0.1
  "@codspeed/vitest-plugin": 5.7.1
  "@playwright/test": 1.62.1
  "@taplo/cli": 0.7.0
  "@types/node": 25.9.5
  "@vitest/coverage-istanbul": 4.1.11
  electron: 42.10.1
  fd-lock: 2.2.0
  husky: 9.1.7
  markdownlint-cli2: 0.23.2
  monocart-reporter: 2.12.6
  oxfmt: 0.65.0
  oxlint: 1.80.0
  selfsigned: 5.5.0
  tsx: 4.23.12
  typedoc: 0.28.20
  typedoc-theme-oxide: 0.3.0
  typescript: 6.0.3
  undici: 8.10.0
  vite: 8.2.2
  vite-plugin-dts: 5.0.3
  vitest: 4.1.11

minimumReleaseAge: 1440

storeDir: .cache/native/pnpm

minimumReleaseAgeExclude:
  - node-addon-slsa

overrides:
  # Security floor for transitive deps that ask for old undici (codecov,
  # cheerio, @electron/get pull 6.x/7.x indirectly and we leave those at the
  # versions they were tested against). 6.23.0 patched a series of CVEs.
  undici@<6.23.0: ">=6.23.0"
  # CVE floor — older @isaacs/brace-expansion has a ReDoS.
  "@isaacs/brace-expansion": ">=5.0.1"

strictDepBuilds: true
