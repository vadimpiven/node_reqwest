packages:
  - packages/core
  - packages/meta
  - packages/node

allowBuilds:
  electron: true
  esbuild: true
  node-addon-slsa: true

blockExoticSubdeps: true
trustPolicy: no-downgrade

# required for `bump-version` script to not trigger packages reinstall
verifyDepsBeforeRun: false

catalog:
  "@codecov/vite-plugin": 2.0.1
  "@codspeed/vitest-plugin": 5.7.1
  "@playwright/test": 1.64.1
  "@taplo/cli": 0.7.0
  "@types/node": 26.6.5
  "@vitest/coverage-v8": 4.1.12
  electron: 44.9.3
  fd-lock: 2.2.0
  husky: 9.1.7
  markdownlint-cli2: 0.24.0
  monocart-reporter: 2.15.1
  oxfmt: 0.74.0
  oxlint: 1.89.0
  selfsigned: 5.5.0
  tsx: 4.23.15
  typedoc: 0.28.20
  typedoc-theme-oxide: 0.3.0
  # TypeDoc 0.28.20 is incompatible with TypeScript 7's compiler API.
  # https://github.com/TypeStrong/typedoc/issues/3098
  typescript: 6.0.3
  undici: 8.12.3
  vite: 7.3.7
  vite-plugin-dts: 5.1.2
  vitest: 4.1.12

minimumReleaseAge: 10080

storeDir: .cache/native/pnpm

minimumReleaseAgeExclude:
  - node-addon-slsa

overrides:
  # Security floor for transitive deps that ask for old undici (codecov,
  # cheerio, @electron/get pull 6.x/7.x indirectly and we leave those at the
  # versions they were tested against). 6.23.0 patched a series of CVEs.
  undici@<6.23.0: ">=6.23.0"
  # CVE floor — older @isaacs/brace-expansion has a ReDoS.
  "@isaacs/brace-expansion": ">=5.0.1"

strictDepBuilds: true
